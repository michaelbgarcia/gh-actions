# ============================================================================
# LESSON 07 - Scheduling, concurrency, conditionals and secrets.
#
# The operational layer. These are the keys that stop CI from wasting your
# minutes and from leaking things it should not.
# ============================================================================

name: 07 - Schedules and guards

on:
  workflow_dispatch:
    # Inputs turn the "Run workflow" button into a small form.
    inputs:
      r_version:
        description: 'R version to test against'
        required: false
        default: 'release'
        type: choice
        options: ['release', 'oldrel-1', 'devel']
      verbose:
        description: 'Verbose test output'
        required: false
        default: false
        type: boolean

  schedule:
    # POSIX cron, always in UTC -- there is no timezone option. 07:00 UTC is
    # 03:00 in America/New_York during EDT, 02:00 during EST. A "9am daily"
    # schedule silently shifts by an hour twice a year; write the UTC time you
    # actually want and note the local equivalent in a comment.
    #
    # Nightly at 07:00 UTC, weekdays only.
    - cron: '0 7 * * 1-5'

# Cancel an in-flight run when a newer commit lands on the same branch.
# Without this, pushing three times in a minute queues three full matrices.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nightly:
    runs-on: ubuntu-latest

    # Scheduled workflows keep running on forks of your repo, burning someone
    # else's minutes on a schedule they never set. This guard is standard
    # practice on public repos.
    if: github.event_name != 'schedule' || github.repository_owner == 'REPLACE_WITH_YOUR_GITHUB_USERNAME'

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          # Inputs are only present on workflow_dispatch. On a schedule the
          # expression is empty, so supply a fallback with ||.
          r-version: ${{ inputs.r_version || 'release' }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, local::.
          needs: check

      - name: Install enrollr
        run: R CMD INSTALL --no-multiarch --with-keep.source .

      - name: Run tests
        env:
          # SECRETS. Set these under Settings -> Secrets and variables ->
          # Actions. They are masked in logs: if a secret value appears in
          # output, GitHub replaces it with ***.
          #
          # This is a demo reference -- the secret does not need to exist for
          # the workflow to run; the value is simply empty.
          DEMO_API_KEY: ${{ secrets.DEMO_API_KEY }}

          # `vars` are the non-secret counterpart: visible in logs, editable
          # without re-entering, right for things like an environment name.
          TEST_VERBOSITY: ${{ inputs.verbose && 'verbose' || 'quiet' }}
        run: |
          echo "Verbosity: $TEST_VERBOSITY"
          if [ -z "$DEMO_API_KEY" ]; then
            echo "No DEMO_API_KEY secret is configured (expected for this demo)."
          else
            echo "A secret is present. Note that echoing it prints *** :"
            echo "$DEMO_API_KEY"
          fi
          Rscript -e 'testthat::test_local(stop_on_failure = TRUE)'

      # Turn a nightly failure into an issue so it does not sit unnoticed in
      # the Actions tab. Only on the schedule -- you do not want an issue
      # opened every time you push a broken commit.
      - name: Open an issue if the nightly broke
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nightly test run failed (${new Date().toISOString().slice(0, 10)})`,
              body: `The scheduled run failed.\n\n[View the run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: ['ci', 'nightly']
            });

    # STATUS FUNCTIONS worth memorising:
    #   success()  - default; every previous step passed
    #   failure()  - a previous step failed
    #   always()   - run no matter what, including on cancellation
    #   cancelled()- the run was cancelled
    # `if: always()` is how you get logs and artifacts off a failed run.
