# ============================================================================
# LESSON 03 - The one that matters: running testthat automatically.
#
# New ideas: dependency resolution from DESCRIPTION, package caching,
# `if: always()`, uploading artifacts, and the difference between
# testthat::test_local() and R CMD check.
# ============================================================================

name: 03 - Run testthat

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'R/**'
      - 'tests/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - '.github/workflows/03-testthat.yaml'
  # Pull request runs are the real payoff. This is what lets you require a
  # green suite before merge (Settings -> Branches -> branch protection).
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      # Reads Depends/Imports/Suggests out of DESCRIPTION, resolves the whole
      # dependency tree, installs it, AND caches it keyed on the resolved
      # versions. The second run of this workflow is dramatically faster.
      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # `local::.` means "this package, from source, right here".
          # `any::` prefixes mean "any repository has it, just get it".
          extra-packages: |
            any::testthat
            any::devtools
            local::.
          # Turn testthat warnings into visible CI output rather than silence.
          needs: check

      # Install the package itself so library(enrollr) works and so
      # system.file() can find inst/app.
      - name: Install enrollr
        run: R CMD INSTALL --no-multiarch --with-keep.source .

      # THE TEST STEP.
      # test_local() is faster and more focused than R CMD check: it runs your
      # tests and nothing else. Use it as the fast feedback loop; use
      # R CMD check (lesson 06) as the thorough pre-release gate.
      - name: Run testthat
        run: |
          Rscript -e '
            # test_local() runs with its working directory switched to
            # tests/testthat/ while tests execute, so a relative file name
            # here would land there instead of the repo root. Use an
            # absolute path so it always ends up where the upload step
            # below expects it.
            res <- testthat::test_local(
              path = ".",
              reporter = testthat::MultiReporter$new(list(
                testthat::ProgressReporter$new(),
                testthat::JunitReporter$new(file = file.path(normalizePath("."), "test-results.xml"))
              )),
              stop_on_failure = FALSE
            )

            df <- as.data.frame(res)
            cat("\n--- summary ---\n")
            cat("failed :", sum(df$failed), "\n")
            cat("errors :", sum(df$error), "\n")
            cat("skipped:", sum(df$skipped), "\n")
            cat("passed :", sum(df$passed), "\n")

            # Set the exit code ourselves so the JUnit file is always written
            # before the job goes red.
            if (sum(df$failed) > 0 || any(df$error)) {
              quit(status = 1)
            }
          '

      # `if: always()` makes this step run even though the previous one failed.
      # Without it you would lose the test report on exactly the runs where you
      # need it most.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
          retention-days: 14
          # Do not fail the job just because the file is missing.
          if-no-files-found: warn

      # Writes into the run's summary page -- the markdown you see at the top
      # of the Actions run, above the job list. Much nicer than digging
      # through logs.
      - name: Write a job summary
        if: always()
        run: |
          {
            echo "## testthat results"
            echo ""
            if [ -f test-results.xml ]; then
              echo '```'
              grep -o 'tests="[0-9]*"' test-results.xml | head -1
              grep -o 'failures="[0-9]*"' test-results.xml | head -1
              echo '```'
            else
              echo "No results file was produced -- the suite did not run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
